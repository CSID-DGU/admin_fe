# location 안에 add_header가 하나라도 있으면 server의 add_header가 전부 무시된다. 그래서 캐시 정책은
# 상태 코드와 경로로 값을 map에서 고르고, 모든 헤더를 server에서 한 번만 붙인다(빈 값이면 보내지 않음).
# index.html은 해시된 자산 파일명을 담고 있어 캐시하면 배포 뒤에도 예전 JS/CSS를 계속 참조한다.
# Vite 산출물(js/css)은 파일명에 콘텐츠 해시가 있어 무기한 캐시해도 안전하고, public/ 이미지는 짧게만 캐시한다.
# 404 같은 오류 응답은 캐시하지 않는다.
map "$status:$uri" $static_cache_control {
    default                                             "";
    ~^(200|304):/index\.html$                           "no-cache";
    ~*^(200|304):.*\.(?:js|css)$                        "public, max-age=31536000, immutable";
    ~*^(200|304):.*\.(?:jpg|jpeg|png|webp|svg|ico)$     "public, max-age=604800";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # HSTS는 앞단 ingress가 붙인다. 화면은 다른 사이트의 iframe에 들어갈 일이 없으므로 프레임 삽입을 막는다.
    add_header Cache-Control $static_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://admin-prod.default.svc.cluster.local;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        # Spring Security가 같은 헤더를 붙이므로 여기서 한 벌만 남긴다.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        # 타임아웃 체인: config-server(500s) < admin_be(550s) < 여기(570s) < 프론트(600s).
        # nginx 기본 proxy_read_timeout(60s)에 끊기지 않도록 늘리되, 프론트보다는 짧게 잡는다.
        proxy_connect_timeout 570s;
        proxy_send_timeout 570s;
        proxy_read_timeout 570s;
    }

    # admin_be의 config-server·인프라 전용 API는 화면에서 쓰지 않는다. 사용자 비밀번호를 돌려주는 설정 조회가
    # 섞여 있으므로 admin_be의 내부 토큰 검사와 별개로 여기서도 막는다. 신청 화면의 이름 중복 확인만 넘긴다.
    location ~ ^/api/requests/config/(?!check-username$) {
        return 404;
    }

    location ^~ /api/internal/ {
        return 404;
    }

    # config-server에는 인증이 없다. 화면이 쓰는 경로는 진행 상황 조회(GET /requests/{id}/status) 하나뿐이므로
    # 그것만 넘기고, 나머지(작업 등록·Pod 삭제·그룹 변경·API 문서 등)는 밖에서 부를 수 없게 막는다.
    location ~ ^/pod-status/requests/[^/]+/status$ {
        limit_except GET { deny all; }
        rewrite ^/pod-status(/.*)$ $1 break;
        proxy_pass http://containerssh-config-service.ailab-infra.svc.cluster.local;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /pod-status/ {
        return 404;
    }

    # 없는 자산 파일은 index.html로 넘기지 않고 404로 끝낸다(캐시 헤더는 위 map이 정한다).
    location ~* \.(?:js|css|jpg|jpeg|png|webp|svg|ico)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
