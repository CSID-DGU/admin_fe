server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://admin-prod.default.svc.cluster.local;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        # 타임아웃 체인: config-server(500s) < admin_be(550s) < 여기(570s) < 프론트(600s).
        # nginx 기본 proxy_read_timeout(60s)에 끊기지 않도록 늘리되, 프론트보다는 짧게 잡는다.
        proxy_connect_timeout 570s;
        proxy_send_timeout 570s;
        proxy_read_timeout 570s;
    }

    # admin_be의 config-server·인프라 전용 API는 화면에서 쓰지 않는다. 사용자 비밀번호를 돌려주는 설정 조회가
    # 섞여 있으므로 admin_be의 내부 토큰 검사와 별개로 여기서도 막는다. 신청 화면의 이름 중복 확인만 넘긴다.
    location ~ ^/api/requests/config/(?!check-username$) {
        return 404;
    }

    location ^~ /api/internal/ {
        return 404;
    }

    # config-server에는 인증이 없다. 화면이 쓰는 경로는 진행 상황 조회(GET /requests/{id}/status) 하나뿐이므로
    # 그것만 넘기고, 나머지(작업 등록·Pod 삭제·그룹 변경·API 문서 등)는 밖에서 부를 수 없게 막는다.
    location ~ ^/pod-status/requests/[^/]+/status$ {
        limit_except GET { deny all; }
        rewrite ^/pod-status(/.*)$ $1 break;
        proxy_pass http://containerssh-config-service.ailab-infra.svc.cluster.local;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /pod-status/ {
        return 404;
    }

    # Vite 빌드 산출물은 파일명에 콘텐츠 해시가 들어있어(index-XXXX.js) 내용이 바뀌면
    # 파일명도 바뀐다 — 그래서 무기한 캐시해도 안전하다.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html은 해시된 자산 파일명을 담고 있으므로 절대 오래 캐시하면 안 된다 —
    # 캐시되면 배포해도 사용자가 예전 JS/CSS를 계속 참조하게 된다.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # public/ 아래 이미지 등은 파일명이 고정이라(해시 없음) 짧게만 캐시한다.
    location ~* \.(?:jpg|jpeg|png|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
